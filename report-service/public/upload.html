<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add site photos</title>
<style>
  :root { --ink: #16181d; --muted: #6b7280; --line: #e5e7eb; --bg: #f4f3ef; --card: #fff; --red: #e1261c; --green: #1f9d55; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f3f4f6; --muted: #9ca3af; --line: #374151; --bg: #111317; --card: #1b1e24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { border-bottom: 3px solid var(--red); padding-bottom: 10px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .pick { display: block; text-align: center; border: 2px dashed var(--line); border-radius: 14px; padding: 22px 12px; cursor: pointer; font-weight: 600; }
  .pick input { display: none; }
  .item { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .item img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .item input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; font-size: 14px; background: transparent; color: var(--ink); }
  .state { font-size: 12px; color: var(--muted); width: 56px; text-align: right; flex: none; }
  .state.ok { color: var(--green); }
  .state.err { color: var(--red); }
  button { width: 100%; border: 0; border-radius: 999px; padding: 13px; font: inherit; font-weight: 700; font-size: 15px; background: var(--red); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 14px; margin-top: 10px; }
  .done { color: var(--green); font-weight: 600; }
  .error { color: var(--red); }
  .existing { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Add site photos</h1>
    <p class="sub" id="summary">Loading report…</p>
  </header>
  <div class="card">
    <label class="pick">📷 Take or choose photos<input id="files" type="file" accept="image/*" multiple></label>
    <div id="list"></div>
    <p class="existing" id="existing"></p>
  </div>
  <button id="send" disabled>Upload and send updated report</button>
  <p class="msg" id="msg"></p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const token = params.get("t");
  const q = `id=${encodeURIComponent(id || "")}&t=${encodeURIComponent(token || "")}`;
  const $ = (sel) => document.getElementById(sel);
  let info = null;
  let items = [];

  function setMsg(text, cls) { $("msg").textContent = text; $("msg").className = `msg ${cls || ""}`; }

  async function load() {
    const res = await fetch(`/api/photos?${q}`);
    if (!res.ok) { $("summary").textContent = "This link is not valid. Use the link from the report email."; return; }
    info = await res.json();
    $("summary").textContent = `${info.projectName} · ${info.visitDate}${info.engineer ? " · " + info.engineer : ""}`;
    if (info.photos.length) $("existing").textContent = `${info.photos.length} photo(s) already attached.`;
  }

  // Resize on the phone so uploads stay small on site networks.
  function resize(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("resize failed"))), "image/jpeg", 0.82);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error("not an image"));
      img.src = URL.createObjectURL(file);
    });
  }

  function captionFor(index) {
    const known = info && info.captions[(info.photos.length + index)];
    return known ? String(known).split("|")[0].trim() : "";
  }

  $("files").addEventListener("change", (event) => {
    const room = info ? info.maxPhotos - info.photos.length - items.length : 0;
    const files = [...event.target.files].slice(0, Math.max(0, room));
    for (const file of files) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `<img alt=""><input placeholder="Caption (optional)"><span class="state">Ready</span>`;
      row.querySelector("img").src = URL.createObjectURL(file);
      row.querySelector("input").value = captionFor(items.length);
      $("list").appendChild(row);
      items.push({ file, row });
    }
    if (event.target.files.length > files.length) setMsg(`Only ${info.maxPhotos} photos can be attached.`, "error");
    $("send").disabled = !items.length;
    event.target.value = "";
  });

  $("send").addEventListener("click", async () => {
    $("send").disabled = true;
    setMsg("Uploading…");
    for (const item of items) {
      const state = item.row.querySelector(".state");
      if (state.classList.contains("ok")) continue;
      try {
        state.textContent = "…";
        const body = await resize(item.file);
        const caption = encodeURIComponent(item.row.querySelector("input").value.trim());
        const res = await fetch(`/api/photos?${q}&caption=${caption}`, { method: "POST", headers: { "content-type": "image/jpeg" }, body });
        if (!res.ok) throw new Error((await res.json()).error || res.status);
        state.textContent = "Done"; state.className = "state ok";
      } catch (err) {
        state.textContent = "Failed"; state.className = "state err";
        setMsg(`A photo failed to upload: ${err.message}. Tap the button to retry.`, "error");
        $("send").disabled = false;
        return;
      }
    }
    setMsg("Building the updated report…");
    const res = await fetch(`/api/finalize?${q}`, { method: "POST" });
    if (res.ok) {
      const out = await res.json();
      setMsg(`Sent. The updated report with ${out.photoCount} photo(s) has been emailed.`, "done");
    } else {
      setMsg(`Photos are saved, but the email failed. Tap the button to try again.`, "error");
      $("send").disabled = false;
    }
  });

  load();
</script>
</body>
</html>
